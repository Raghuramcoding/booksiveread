  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books I've Read</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2eb;
      --surface: #ffffff;
      --text: #1a1814;
      --muted: #7a7468;
      --accent: #534AB7;
      --accent-dark: #3C3489;
      --accent-light: #EEEDFE;
      --border: rgba(0,0,0,0.1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .count {
      font-size: clamp(72px, 16vw, 140px);
      font-weight: normal;
      line-height: 1;
      color: var(--text);
      transition: transform 0.15s cubic-bezier(.4,2,.6,1);
      text-align: center;
    }
    .count.pop { transform: scale(1.08); }

    .count-sub {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.5rem;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .shelf-wrap {
      width: 100%;
      max-width: 640px;
      border-bottom: 2px solid var(--text);
      margin-bottom: 2rem;
    }

    .shelf {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: flex-start;
      min-height: 52px;
    }

    .spine {
      flex-shrink: 0;
      border-radius: 2px 2px 0 0;
    }

    .shelf-note {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
      text-align: center;
    }

    .locked-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .lock-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .lock-btn:hover { background: rgba(0,0,0,0.04); }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 1.5rem;
    }

    .btn-row { display: flex; gap: 20px; align-items: center; }

    .btn-plus {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 42px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, transform 0.1s;
    }
    .btn-plus:hover { background: var(--accent-dark); }
    .btn-plus:active { transform: scale(0.92); }

    .btn-minus {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--surface); color: var(--muted);
      font-size: 28px; border: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, transform 0.1s;
    }
    .btn-minus:hover { background: #f0ede6; }
    .btn-minus:active { transform: scale(0.92); }
    .btn-minus:disabled { opacity: 0.3; cursor: default; }

    .set-row { display: flex; gap: 8px; width: 100%; }
    .set-row input {
      flex: 1; border: 1px solid var(--border); border-radius: 6px;
      padding: 0 12px; font-size: 15px; font-family: inherit;
      background: var(--surface); color: var(--text); height: 40px;
    }
    .set-row button {
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text);
      font-size: 13px; padding: 0 16px; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }
    .set-row button:hover { background: #f0ede6; }

    .pin-overlay {
      width: 100%; max-width: 280px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      margin-bottom: 1.5rem;
    }

    .pin-label { font-size: 13px; color: var(--muted); }

    .pin-dots { display: flex; gap: 10px; }
    .pin-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #e0ddd5; border: 1px solid var(--border);
      transition: background 0.15s;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }

    .pin-err { font-size: 12px; color: #c0392b; min-height: 16px; }

    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .pin-key {
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text);
      font-size: 18px; height: 48px; cursor: pointer;
      font-family: inherit;
      transition: background 0.1s, transform 0.1s;
    }
    .pin-key:hover { background: #f5f2eb; }
    .pin-key:active { transform: scale(0.94); }

    .log { max-width: 320px; width: 100%; font-size: 0.8rem; color: var(--muted); }
    .log-title { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; margin-bottom: 6px; }
    .log-entry { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--border); }

    .reset {
      margin-top: 1rem; background: none; color: var(--muted);
      font-size: 0.78rem; border: none; cursor: pointer; font-family: inherit;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .reset:hover { color: var(--text); }
  </style>
</head>
<body>
  <h1>Books I've Read</h1>

  <div class="count" id="count">0</div>
  <div class="count-sub" id="count-sub">no books yet</div>

  <div class="shelf-wrap">
    <div class="shelf" id="shelf"></div>
    <div class="shelf-note" id="shelf-note"></div>
  </div>

  <div class="locked-bar" id="lockedBar">
    <span>&#128274; locked</span>
    <button class="lock-btn" id="unlockBtn">&#128273; unlock</button>
  </div>

  <div id="pinOverlay" class="pin-overlay" style="display:none;">
    <div class="pin-label">enter PIN to edit</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-err" id="pinErr"></div>
    <div class="pin-pad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key" data-k="back">&#9003;</button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key" data-k="cancel" style="font-size:12px;">cancel</button>
    </div>
  </div>

  <div id="editControls" class="controls" style="display:none;">
    <div class="btn-row">
      <button class="btn-minus" id="btnMinus" disabled aria-label="Remove one">&#8722;</button>
      <button class="btn-plus" id="btnPlus" aria-label="Add one book">+</button>
    </div>
    <div class="set-row">
      <input type="number" id="setInput" placeholder="Set exact number" min="0" />
      <button id="setBtn">Set</button>
    </div>
    <button class="lock-btn" id="lockBtn" style="margin-top:4px;">&#128274; lock</button>
    <button class="reset" id="resetBtn">reset to 0</button>
  </div>

  <div class="log" id="logSection" style="display:none;">
    <div class="log-title">Recent</div>
    <div id="log-entries"></div>
  </div>

  <script>
    const PIN = '2014';
    const COLORS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#BA7517','#D4537E','#639922','#3C3489','#0F6E56','#993C1D','#AFA9EC','#5DCAA5','#F0997B','#85B7EB','#EF9F27','#ED93B1','#97C459','#534AB7'];
    const HEIGHTS = [28,36,44,32,40,30,46,34,38,26,42,34];
    const MAX_SPINES = 10000;

    let count = 0, log = [], unlocked = false, pinEntry = '';

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem('booksiveread') || '{}');
        count = d.count || 0;
        log = d.log || [];
      } catch(e) {}
      render();
    }

    function save() {
      localStorage.setItem('booksiveread', JSON.stringify({ count, log: log.slice(-30) }));
    }

    function plural(n) {
      if (n === 0) return 'no books yet';
      if (n === 1) return '1 book';
      return n.toLocaleString() + ' books';
    }

    function addLog(msg) {
      const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      log.push({ msg, t });
      if (log.length > 30) log.shift();
    }

    function spineWidth(total) {
      if (total <= 100) return 15;
      if (total <= 500) return 10;
      if (total <= 2000) return 6;
      if (total <= 5000) return 4;
      return 3;
    }

    function spineHeight(i, total) {
      if (total > 2000) return 20 + (i % 3) * 6;
      if (total > 500) return 24 + (i % 4) * 7;
      return HEIGHTS[i % HEIGHTS.length];
    }

    function renderShelf() {
      const shelf = document.getElementById('shelf');
      const note = document.getElementById('shelf-note');
      const show = Math.min(count, MAX_SPINES);
      const w = spineWidth(show);
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < show; i++) {
        const s = document.createElement('div');
        s.className = 'spine';
        s.style.width = w + 'px';
        s.style.height = spineHeight(i, show) + 'px';
        s.style.background = COLORS[i % COLORS.length];
        fragment.appendChild(s);
      }

      shelf.innerHTML = '';
      shelf.appendChild(fragment);
      note.textContent = count > MAX_SPINES
        ? 'showing 10,000 of ' + count.toLocaleString() + ' books'
        : '';
    }

    function render() {
      const el = document.getElementById('count');
      el.textContent = count.toLocaleString();
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 200);

      document.getElementById('count-sub').textContent = plural(count);
      document.getElementById('btnMinus').disabled = count === 0;

      renderShelf();

      document.getElementById('lockedBar').style.display = unlocked ? 'none' : 'flex';
      document.getElementById('editControls').style.display = unlocked ? 'flex' : 'none';

      const ls = document.getElementById('logSection');
      ls.style.display = log.length ? 'block' : 'none';
      const le = document.getElementById('log-entries');
      le.innerHTML = '';
      [...log].reverse().slice(0, 5).forEach(e => {
        const d = document.createElement('div');
        d.className = 'log-entry';
        d.innerHTML = '<span>' + e.msg + '</span><span>' + e.t + '</span>';
        le.appendChild(d);
      });
    }

    function showPin() {
      pinEntry = '';
      document.getElementById('pinOverlay').style.display = 'flex';
      document.getElementById('lockedBar').style.display = 'none';
      document.getElementById('pinErr').textContent = '';
      updateDots();
    }

    function hidePin() {
      pinEntry = '';
      document.getElementById('pinOverlay').style.display = 'none';
      document.getElementById('lockedBar').style.display = unlocked ? 'none' : 'flex';
      updateDots();
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('d' + i).classList.toggle('filled', i < pinEntry.length);
      }
    }

    document.getElementById('unlockBtn').addEventListener('click', showPin);

    document.querySelectorAll('.pin-key').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (k === 'cancel') { hidePin(); return; }
        if (k === 'back') { pinEntry = pinEntry.slice(0, -1); updateDots(); return; }
        if (pinEntry.length >= 4) return;
        pinEntry += k;
        updateDots();
        if (pinEntry.length === 4) {
          if (pinEntry === PIN) {
            unlocked = true; hidePin(); render();
          } else {
            document.getElementById('pinErr').textContent = 'incorrect PIN';
            setTimeout(() => {
              pinEntry = ''; updateDots();
              document.getElementById('pinErr').textContent = '';
            }, 800);
          }
        }
      });
    });

    document.getElementById('lockBtn').addEventListener('click', () => { unlocked = false; render(); });

    document.getElementById('btnPlus').addEventListener('click', () => {
      count++; addLog('Added — now ' + count.toLocaleString()); render(); save();
    });

    document.getElementById('btnMinus').addEventListener('click', () => {
      if (count > 0) { count--; addLog('Removed — now ' + count.toLocaleString()); render(); save(); }
    });

    document.getElementById('setBtn').addEventListener('click', () => {
      const val = parseInt(document.getElementById('setInput').value);
      if (!isNaN(val) && val >= 0) {
        addLog('Set from ' + count.toLocaleString() + ' to ' + val.toLocaleString());
        count = val;
        document.getElementById('setInput').value = '';
        render(); save();
      }
    });

    document.getElementById('setInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('setBtn').click();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!count) return;
      if (confirm('Reset to 0?')) { addLog('Reset from ' + count.toLocaleString()); count = 0; render(); save(); }
    });

    load();
  </script>
</body>
</html>
